<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI托管助手 - 管理面板</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --border: #333;
  --text: #e0e0e0;
  --text2: #999;
  --accent: #4ade80;
  --accent2: #22c55e;
  --danger: #ef4444;
  --warn: #f59e0b;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: var(--surface); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 360px; text-align: center; }
.login-card h1 { font-size: 20px; margin-bottom: 8px; }
.login-card p { color: var(--text2); margin-bottom: 24px; font-size: 14px; }
.login-card input { width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 16px; text-align: center; letter-spacing: 4px; }
.login-card input:focus { outline: none; border-color: var(--accent); }
.login-card button { width: 100%; margin-top: 16px; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; }
.login-card button:hover { background: var(--accent2); }
.login-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
.app { display: none; max-width: 1200px; margin: 0 auto; padding: 20px; }
.app-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.app-header h1 { font-size: 18px; }
.app-header button { padding: 8px 16px; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius); cursor: pointer; }
.app-header button:hover { border-color: var(--danger); color: var(--danger); }
.tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--surface); border-radius: var(--radius); padding: 4px; }
.tab { padding: 10px 20px; border: none; background: transparent; color: var(--text2); border-radius: 6px; cursor: pointer; font-size: 14px; }
.tab.active { background: var(--surface2); color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); }
.stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-card .label { font-size: 13px; color: var(--text2); margin-top: 4px; }
.panel { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-header h2 { font-size: 15px; }
.panel-body { padding: 20px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 16px; text-align: left; font-size: 13px; }
th { color: var(--text2); font-weight: 500; border-bottom: 1px solid var(--border); }
td { border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--surface2); }
select, input[type=text], textarea { padding: 8px 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 13px; }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { width: 100%; min-height: 80px; font-family: inherit; }
.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: var(--accent2); }
.btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-green { background: #166534; color: #4ade80; }
.badge-gray { background: #333; color: #999; }
.filter-bar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
.filter-bar select, .filter-bar input { min-width: 140px; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; z-index: 1000; animation: slideIn 0.3s; }
.toast-success { background: #166534; color: #4ade80; border: 1px solid #22c55e; }
.toast-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.persona-card { background: var(--surface2); padding: 16px; border-radius: var(--radius); margin-bottom: 12px; border: 1px solid var(--border); }
.persona-card.active { border-color: var(--accent); }
.persona-card h3 { font-size: 15px; margin-bottom: 8px; }
.persona-card p { font-size: 13px; color: var(--text2); }
.persona-actions { margin-top: 12px; display: flex; gap: 8px; }
.empty { text-align: center; color: var(--text2); padding: 40px; font-size: 14px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login" id="loginView">
  <div class="login-card">
    <h1>🔐 AI托管助手</h1>
    <p>请输入管理密码</p>
    <input type="password" id="passwordInput" placeholder="输入密码" autofocus>
    <button onclick="login()">登录</button>
    <div class="login-error" id="loginError">密码错误</div>
  </div>
</div>

<div class="app" id="appView">
  <div class="app-header">
    <h1>📊 AI托管助手 · 管理面板</h1>
    <button onclick="logout()">退出登录</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview')">📈 概览</button>
    <button class="tab" onclick="switchTab('history')">💬 聊天记录</button>
    <button class="tab" onclick="switchTab('contacts')">👤 联系人</button>
    <button class="tab" onclick="switchTab('personas')">🎭 人设管理</button>
    <button class="tab" onclick="switchTab('tokens')">🔑 设备密钥</button>
  </div>

  <div id="tabOverview">
    <div class="stats" id="statsGrid"></div>
    <div class="panel">
      <div class="panel-header"><h2>最近回复</h2></div>
      <div class="panel-body" id="recentReplies"></div>
    </div>
  </div>

  <div id="tabHistory" style="display:none">
    <div class="panel">
      <div class="panel-header"><h2>聊天记录</h2></div>
      <div class="panel-body">
        <div class="filter-bar">
          <select id="filterToken" onchange="loadHistory()"><option value="">全部设备</option></select>
          <select id="filterPlatform" onchange="loadHistory()">
            <option value="">全部平台</option><option value="soul">Soul</option><option value="qq">QQ</option><option value="immomo">陌陌</option><option value="lianxin">连信</option>
          </select>
          <input type="text" id="filterContact" placeholder="搜索联系人..." oninput="loadHistory()">
        </div>
        <div id="historyTable"></div>
      </div>
    </div>
  </div>

  <div id="tabContacts" style="display:none">
    <div class="panel">
      <div class="panel-header"><h2>联系人管理</h2></div>
      <div class="panel-body">
        <div class="filter-bar">
          <select id="contactFilterToken" onchange="loadContacts()"><option value="">全部设备</option></select>
          <select id="contactFilterPlatform" onchange="loadContacts()">
            <option value="">全部平台</option><option value="soul">Soul</option><option value="qq">QQ</option><option value="immomo">陌陌</option><option value="lianxin">连信</option>
          </select>
        </div>
        <div id="contactsTable"></div>
      </div>
    </div>
  </div>

  <div id="tabPersonas" style="display:none">
    <div class="panel">
      <div class="panel-header">
        <h2>人设管理</h2>
        <button class="btn btn-primary" onclick="addPersona()">+ 新建人设</button>
      </div>
      <div class="panel-body" id="personasList"></div>
    </div>
  </div>

  <div id="tabTokens" style="display:none">
    <div class="panel">
      <div class="panel-header"><h2>设备密钥</h2></div>
      <div class="panel-body" id="tokensTable"></div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
