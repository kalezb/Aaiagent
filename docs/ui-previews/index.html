<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星暮托管助手 · 单页 UI 预览</title>
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header class="gallery-header">
    <div>
      <p>Single-page Console</p>
      <h1>星暮托管助手 · 两套单页配色</h1>
      <span>功能顺序保持一致，所有开关点击整块即可切换。左侧是清爽的天际蓝，右侧是更有质感的爱马仕橙。</span>
    </div>
    <div class="gallery-note">
      <strong>单页控制台</strong>
      <span>无底部多页导航</span>
    </div>
  </header>

  <main class="gallery-grid">
    <section class="gallery-card gallery-card--sky" data-theme="sky">
      <div class="gallery-card__head">
        <div>
          <span class="gallery-card__label">方案 A</span>
          <h2>天际蓝</h2>
          <p>干净、清晰、偏运营工具，适合长时间盯着状态和消息。</p>
        </div>
        <a href="./preview.html?theme=sky" target="_blank" rel="noreferrer">独立预览</a>
      </div>
      <div class="gallery-frame">
        <iframe src="./preview.html?theme=sky" title="天际蓝单页预览"></iframe>
      </div>
    </section>

    <section class="gallery-card gallery-card--orange" data-theme="orange">
      <div class="gallery-card__head">
        <div>
          <span class="gallery-card__label">方案 B</span>
          <h2>爱马仕橙</h2>
          <p>暖色点缀更明显，开关状态和重点操作更容易一眼识别。</p>
        </div>
        <a href="./preview.html?theme=orange" target="_blank" rel="noreferrer">独立预览</a>
      </div>
      <div class="gallery-frame">
        <iframe src="./preview.html?theme=orange" title="爱马仕橙单页预览"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
