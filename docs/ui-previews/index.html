<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 托管助手 UI 方案</title>
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header class="gallery-header">
    <div>
      <p>UI Concepts</p>
      <h1>AI 托管助手 · 三版界面预览</h1>
      <span>同一套功能与交互，分别强化沉稳科技感、明亮效率感和东方质感。预览页均可点击开关和切换模式。</span>
    </div>
  </header>

  <main class="gallery-grid">
    <section class="gallery-card" data-theme="obsidian">
      <div class="gallery-card__head">
        <div>
          <span class="gallery-card__label">方案 A</span>
          <h2>曜石控制台</h2>
          <p>深色专业感，重点突出托管状态和实时运行反馈。</p>
        </div>
        <a href="./preview.html?theme=obsidian" target="_blank" rel="noreferrer">独立预览</a>
      </div>
      <div class="gallery-frame">
        <iframe src="./preview.html?theme=obsidian" title="曜石控制台预览"></iframe>
      </div>
    </section>

    <section class="gallery-card" data-theme="mist">
      <div class="gallery-card__head">
        <div>
          <span class="gallery-card__label">方案 B</span>
          <h2>云白指挥台</h2>
          <p>明亮清晰，信息密度适中，适合长时间查看和操作。</p>
        </div>
        <a href="./preview.html?theme=mist" target="_blank" rel="noreferrer">独立预览</a>
      </div>
      <div class="gallery-frame">
        <iframe src="./preview.html?theme=mist" title="云白指挥台预览"></iframe>
      </div>
    </section>

    <section class="gallery-card" data-theme="jade">
      <div class="gallery-card__head">
        <div>
          <span class="gallery-card__label">方案 C</span>
          <h2>青玉商务版</h2>
          <p>温润克制，强调信任、关系和长期客户经营。</p>
        </div>
        <a href="./preview.html?theme=jade" target="_blank" rel="noreferrer">独立预览</a>
      </div>
      <div class="gallery-frame">
        <iframe src="./preview.html?theme=jade" title="青玉商务版预览"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
